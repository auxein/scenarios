[project]
name = "auxein-scenarios"
version = "0.0.0"
description = "Demonstrations built on Auxein: worlds, and everything needed to evolve agents in them, watch them and show the results."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Davide Palmisano", email = "dpalmisano@gmail.com" }]
requires-python = ">=3.11"
# the scenarios are run from this repository, never published: the classifier makes PyPI refuse an accidental upload
classifiers = ["Private :: Do Not Upload"]
dependencies = ["auxein", "numpy>=1.26", "array-api-compat>=1.9"]

[project.optional-dependencies]
# torch is named directly, not only through auxein's extra, because uv applies `[tool.uv.sources]` (the CPU-only index below)
# to direct dependencies only
torch = ["auxein[torch]", "torch>=2.4"]
# pycma, for the CMA-ES comparison run (design doc §6)
cma = ["auxein[cma]"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
# Video work (design doc §7). imageio-ffmpeg ships a static ffmpeg binary in its wheel (macOS arm64 and Linux x86-64), which
# matplotlib's FFMpegWriter is pointed at, so no system ffmpeg is needed: `uv sync` alone is enough on a Mac and in CI.
render = [
    "matplotlib>=3.9",
    "imageio-ffmpeg>=0.5",
]

[tool.uv]
# rendering is part of what the repository is for, so its dependencies are installed by default; torch is not (an extra),
# so that CI can check the numpy-only installation
default-groups = ["dev", "render"]
# Every resolution must contain wheels for x86_64 Linux (CI), as in Auxein.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# Committed code always depends on a released Auxein tag (CLAUDE.md, "Working on Auxein from this repository"); to move to a
# newer one, change `tag` and run `uv lock --upgrade-package auxein`.
# On Linux (CI) torch comes from PyTorch's CPU-only index, as in Auxein: the default PyPI wheels pull in about 3 GB of CUDA
# libraries that the tests never use. Other platforms keep the PyPI wheels (macOS wheels include Metal/MPS support).
[tool.uv.sources]
auxein = { git = "https://github.com/auxein/auxein", tag = "v0.3.2" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auxein_scenarios"]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.pyright]
include = ["auxein_scenarios", "tests"]
pythonVersion = "3.11"
# the package is checked in strict mode, as Auxein's; the tests stay at the standard level, as Auxein's benchmark harness
strict = ["auxein_scenarios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 300
