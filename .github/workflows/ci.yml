name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # The checks run twice: on the numpy-only installation (what `uv sync` gives) and with torch from PyTorch's CPU-only index
    # (`--extra torch`), so that a scenario never needs torch by accident and its torch path is exercised.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        backend: ["numpy", "torch"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked ${{ matrix.backend == 'torch' && '--extra torch' || '' }}
      - run: uv run --no-sync pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check

  typecheck:
    # with torch installed, so that the torch code paths are type-checked too
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra torch
      - run: uv run --no-sync pyright
