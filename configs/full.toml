# The overnight run: the full sizes for 400 generations (about 6.5 hours on the M4's GPU at about a minute per generation,
# twice M2a's 16 scenarios), with a checkpoint every 10 generations; a recording of about 1 GB.
#   uv run --extra torch box-pushing train configs/full.toml
#   uv run --extra torch box-pushing train --resume runs/full-<timestamp>                    # after an interruption
#   uv run --extra torch box-pushing train --resume runs/full-<timestamp> --generations 600  # to extend it
# The defaults (docs/design/box-pushing.md §6) are the full sizes; they are written out here so the file reads on its own.
# Generator 2 (M2b): the box starts clear of walls and obstacles. A config without `generator` means generator 1.

[team]
agents = 40

[scenarios]
easy = 4
full = 28
generator = 2

[strategy]
population = 100
offspring = 100

[budget]
generations = 400

[run]
backend = "torch"
device = "mps"
precision = "float32"
checkpoint_every = 10
