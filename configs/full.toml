# A full run: 400 generations, about 6.2 hours on an Apple-silicon laptop's GPU (56 s per generation), a recording of about 0.7 GB.
#   uv run --extra torch scenarios box-pushing train configs/full.toml
#   uv run --extra torch scenarios box-pushing train --resume runs/full-<timestamp>                    # after an interruption
#   uv run --extra torch scenarios box-pushing train --resume runs/full-<timestamp> --generations 600  # to extend it
# Every other value is the default: torch float32 on Metal, 900 steps, the default fitness weights.

[team]
agents = 40

[scenarios]
easy = 4
full = 28
held_out = 64

[evolution]
population = 100
generations = 400
