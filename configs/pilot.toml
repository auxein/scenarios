# The full sizes for a short run, to see the start of the learning curve (about 12 minutes on the M4's GPU).
#   uv run box-pushing train configs/pilot.toml
# The defaults (docs/design/box-pushing.md §6) are the full sizes: 40 agents, a population of 100, 16 training scenarios
# (4 easy and 12 full), 900 steps, torch float32 on Metal. Only the length differs.

[budget]
generations = 25

[run]
checkpoint_every = 5
