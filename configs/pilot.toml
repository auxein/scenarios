# The full sizes for a short run, to see the start of the learning curve: about 25 minutes on an Apple-silicon laptop's GPU.
#   uv run --extra torch scenarios box-pushing train configs/pilot.toml
# Every other value is the default: torch float32 on Metal, 900 steps, the default fitness weights.

[team]
agents = 40

[scenarios]
easy = 4
full = 28
held_out = 64

[evolution]
population = 100
generations = 25
