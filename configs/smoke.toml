# A tiny run, for tests and a first try on any machine: well under a minute on a CPU, numpy only.
#   uv run scenarios box-pushing train configs/smoke.toml

[world.simulation]
max_steps = 200

[team]
agents = 10

[scenarios]
easy = 2
full = 2
held_out = 4

[evolution]
population = 10
generations = 3

[run]
backend = "numpy"
device = "cpu"
precision = "float64"
