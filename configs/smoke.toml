# A tiny run, for tests and a first try on any machine: about a minute on a CPU, numpy only.
#   uv run box-pushing train configs/smoke.toml
# Only what differs from the defaults (docs/design/box-pushing.md §6) is listed.

[world.simulation]
max_steps = 200

[team]
agents = 10

[scenarios]
easy = 2
full = 2
held_out = 4
generator = 2

[strategy]
population = 10
offspring = 10

[budget]
generations = 3

[run]
backend = "numpy"
device = "cpu"
precision = "float64"
checkpoint_every = 1
