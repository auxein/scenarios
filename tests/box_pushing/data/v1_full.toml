# The overnight run: the full sizes for 400 generations (about 3 hours on the M4's GPU at about 29 s per generation, less as
# teams start delivering early), with a checkpoint every 10 generations.
#   uv run box-pushing train configs/full.toml
#   uv run box-pushing train --resume runs/full-<timestamp>                    # after an interruption
#   uv run box-pushing train --resume runs/full-<timestamp> --generations 600  # to extend it
# The defaults (docs/design/box-pushing.md §6) are the full sizes; they are written out here so the file reads on its own.

[team]
agents = 40

[scenarios]
easy = 4
full = 12

[strategy]
population = 100
offspring = 100

[budget]
generations = 400

[run]
backend = "torch"
device = "mps"
precision = "float32"
checkpoint_every = 10
